<!doctype html>
<meta charset="utf-8">
<title>contours preview</title>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js" } }</script>
<style>body{margin:0;background:#fff;font:12px sans-serif}canvas{display:block}</style>
<img src="/sleep?6" width="1" height="1" alt="">  <!-- holds the load event so a headless screenshot waits -->
<canvas id="c" width="1000" height="1000"></canvas>
<script>
  // Show script errors on the page itself, since there is no console in a screenshot.
  window.addEventListener('error', (e) => { document.body.insertAdjacentHTML('afterbegin',
    `<pre style="position:absolute;color:red;background:#fff">${e.message} @ ${e.filename}:${e.lineno}</pre>`); });
</script>
<script type="module">
// Draws the paper-style contour geometry with Canvas 2D (no WebGL needed).
// Usage: contours_preview.html?data=neghip&t=0.1
// Dynamic imports: headless Firefox screenshots a page with static module imports before it has drawn.
const { simplify } = await import('../src/simplify.js');
const { regionHistograms, buildContours } = await import('../src/contours.js');
const { peakColor } = await import('../src/spineView.js');

const q = new URLSearchParams(location.search);
// Synchronous on purpose: headless `firefox --screenshot` captures at the load event.
const xhr = new XMLHttpRequest();
xhr.open('GET', `../data/${q.get('data') ?? 'neghip'}.json`, false);
xhr.send();
const doc = JSON.parse(xhr.responseText);
const vis = simplify(doc, Number(q.get('t') ?? 0.1));
const h = regionHistograms(doc, vis);
const maxSize = Math.max(...vis.size);
const rMax = Math.min(0.14, Math.max(0.035, 0.42 / Math.sqrt(vis.peaks.length)));
const t0 = performance.now();
const g = buildContours(doc, vis, h, doc.spine.peaks, doc.spine.saddles, {
  rs: Number(q.get('s') ?? 1) * rMax / maxSize, colorOf: peakColor, bg: [1, 1, 1], edge: [0.12, 0.14, 0.18],
  edgeWidth: 0.003, z0: -0.6, zRange: 0.5,
});
const ms = performance.now() - t0;

document.title = `built ${g.triangles} triangles in ${ms.toFixed(0)} ms`;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const S = 400, C = 500;                          // layout [-1.25, 1.25] -> pixels
const toPx = (x, y) => [C + x * S, C - y * S];
const lin2s = (c) => 255 * (c <= 0.0031308 ? 12.92 * c : 1.055 * c ** (1 / 2.4) - 0.055);
const n = g.triangles;
const order = Array.from({ length: n }, (_, i) => i).sort((a, b) => g.positions[a * 9 + 2] - g.positions[b * 9 + 2]);
for (const i of order) {
  const p = g.positions, c = g.colors;
  ctx.fillStyle = `rgb(${lin2s(c[i * 9])|0},${lin2s(c[i * 9 + 1])|0},${lin2s(c[i * 9 + 2])|0})`;
  ctx.beginPath();
  for (let k = 0; k < 3; k++) {
    const [x, y] = toPx(p[i * 9 + k * 3], p[i * 9 + k * 3 + 1]);
    k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath(); ctx.fill();
}
ctx.fillStyle = '#000';
vis.peaks.forEach((id) => { const [x, y] = toPx(...doc.spine.peaks[id]); ctx.fillRect(x - 2, y - 2, 4, 4); });
vis.saddles.forEach((id) => { const [x, y] = toPx(...doc.spine.saddles[id]); ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fill(); ctx.stroke(); });
ctx.fillStyle = '#000';
ctx.fillText(`${q.get('data') ?? 'neghip'}  t=${q.get('t') ?? 0.1}  ${vis.peaks.length} peaks ${vis.saddles.length} saddles  ${n} triangles  built in ${ms.toFixed(0)} ms`, 10, 14);
</script>
<script type="module">
  // Headless Firefox does not capture a canvas painted after load; an <img> it does.
  // (Runs after the drawing module above because module scripts execute in order.)
  const cv = document.getElementById('c');
  const img = new Image(); img.src = cv.toDataURL(); img.style.cssText = 'position:absolute;left:0;top:0';
  document.body.appendChild(img);
  document.body.insertAdjacentHTML('beforeend', `<div style="position:absolute;left:8px;top:20px">${document.title}</div>`);
</script>
