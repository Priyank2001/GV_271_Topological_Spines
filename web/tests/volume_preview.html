<!doctype html>
<meta charset="utf-8">
<title>volume preview</title>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js" } }</script>
<style>body{margin:0;font:12px sans-serif;background:#fff}img{display:block}</style>
<img src="/sleep?8" width="1" height="1" alt="">
<div id="out"></div>
<script>
  addEventListener('error', (e) => { document.getElementById('out').insertAdjacentHTML('beforeend',
    `<pre style="color:red">${e.message} (${(e.filename || '').split('/').pop()}:${e.lineno})</pre>`); });
</script>
<script type="module">
// CPU twin of the fragment shader in src/volumeView.js: same camera, same transfer function,
// same colour/weight volumes and compositing, so the picture can be checked without WebGL.
// ?data=neghip &t=0.1 (p_lo) &th=0.3 (show above) &sel=0 (visible peak index to highlight) &shade=1 &value=1
const q = new URLSearchParams(location.search);
const name = q.get('data') ?? 'neghip';
const x = new XMLHttpRequest(); x.open('GET', `../data/${name}.json`, false); x.send();
const doc = JSON.parse(x.responseText);
const THREE = await import('three');
const { simplify } = await import('../src/simplify.js');
const { VolumeView, rampOf, rayBox, DENSITY } = await import('../src/volumeView.js');
const { peakColor } = await import('../src/spineView.js');

const W = 420, H = 420;
const fake = { domElement: { style: {}, clientWidth: W, clientHeight: H, addEventListener() {}, remove() {},
  getBoundingClientRect: () => ({ left: 0, top: 0, width: W, height: H }), setPointerCapture() {} },
  setPixelRatio() {}, setSize() {}, setClearColor() {}, render() {}, dispose() {} };
globalThis.ResizeObserver = class { observe() {} };
const vv = new VolumeView({ clientWidth: W, clientHeight: H, appendChild() {} }, {}, { renderer: fake });
vv.setGraph(doc);
const vis = simplify(doc, Number(q.get('t') ?? 0.1));
vv.setVisible(vis);
if (q.has('th')) vv.setThreshold(Number(q.get('th')));
if (q.has('sel')) vv.setSelectedPeaks([Number(q.get('sel'))]);
const byValue = q.get('value') === '1', shade = q.get('shade') !== '0';
vv.view.theta = Number(q.get('theta') ?? vv.view.theta);

const [nz, ny, nx] = vv.shape, vals = doc.data.values, lab = vv.label, e = vv.extent;
const at = (X, Y, Z) => vals[Math.min(nx - 1, Math.max(0, X)) + nx * (Math.min(ny - 1, Math.max(0, Y)) + ny * Math.min(nz - 1, Math.max(0, Z)))];
vv.camera.aspect = W / H; vv.camera.updateProjectionMatrix();
const t0 = performance.now();
const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d'), img = ctx.createImageData(W, H);
const ray = new THREE.Raycaster();
const lutC = (v) => peakColor(v).map((c) => c * 255);
const steps = Math.max(nx, ny, nz) * 1.5;
for (let py = 0; py < H; py++) for (let px = 0; px < W; px++) {
  vv.view; // camera placed by voxelToClient below once
  ray.setFromCamera(new THREE.Vector2(((px + 0.5) / W) * 2 - 1, 1 - ((py + 0.5) / H) * 2), vv.camera);
  const o = [ray.ray.origin.x / e[0], ray.ray.origin.y / e[1], ray.ray.origin.z / e[2]];
  const dd = new THREE.Vector3(ray.ray.direction.x / e[0], ray.ray.direction.y / e[1], ray.ray.direction.z / e[2]).normalize();
  const d = [dd.x, dd.y, dd.z];
  const [a, b] = rayBox(o, d);
  let r = 0, g = 0, bl = 0, A = 0;
  if (a <= b) {
    const start = Math.max(a, 0);
    const inc = Math.min(...d.map((c) => 1 / Math.abs(c))), delta = inc / steps;
    for (let t = start; t < b; t += delta) {
      const qx = o[0] + t * d[0] + 0.5, qy = o[1] + t * d[1] + 0.5, qz = o[2] + t * d[2] + 0.5;
      const X = Math.floor(qx * nx), Y = Math.floor(qy * ny), Z = Math.floor(qz * nz);
      const i = Math.min(nx - 1, Math.max(0, X)) + nx * (Math.min(ny - 1, Math.max(0, Y)) + ny * Math.min(nz - 1, Math.max(0, Z)));
      const v = vals[i], s = rampOf(v, vv.thresh), w = lab[4 * i + 3] / 255;
      const sigma = DENSITY * s * w;
      if (sigma > 0) {
        const al = 1 - Math.exp(-sigma * delta);
        let c = byValue ? lutC(v) : [lab[4 * i], lab[4 * i + 1], lab[4 * i + 2]];
        if (shade) {
          const gx = at(X + 1, Y, Z) - at(X - 1, Y, Z), gy = at(X, Y + 1, Z) - at(X, Y - 1, Z), gz = at(X, Y, Z + 1) - at(X, Y, Z - 1);
          const gl = Math.hypot(gx, gy, gz);
          if (gl > 1e-4) { const f = 0.5 + 0.5 * Math.abs((-gx * d[0] - gy * d[1] - gz * d[2]) / gl); c = c.map((k) => k * f); }
        }
        r += (1 - A) * al * c[0]; g += (1 - A) * al * c[1]; bl += (1 - A) * al * c[2]; A += (1 - A) * al;
        if (A > 0.97) break;
      }
    }
  }
  const k = 4 * (py * W + px);
  img.data[k] = r + (1 - A) * 255; img.data[k + 1] = g + (1 - A) * 255; img.data[k + 2] = bl + (1 - A) * 255; img.data[k + 3] = 255;
}
ctx.putImageData(img, 0, 0);
const out = document.getElementById('out');
const im = new Image(); im.src = cv.toDataURL(); out.appendChild(im);
out.insertAdjacentHTML('beforeend', `<div>${name} p_lo=${q.get('t') ?? 0.1} show-above=${vv.thresh.toFixed(2)} sel=${q.get('sel') ?? '-'} ${byValue ? 'by value' : 'by region'} ${shade ? 'shaded' : 'flat'} · ${(performance.now() - t0).toFixed(0)} ms</div>`);
</script>
